<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyShop</title>
<style>
:root{--primary:#6d5efc;--secondary:#ff7a59;--bg:#f6f7fb;--surface:#ffffff;--text:#1f2430;--on-primary:#fff;--on-secondary:#fff;--font:'Prompt',system-ui,sans-serif;--fs:16px;--hw:700;
--muted:color-mix(in srgb,var(--text) 58%,transparent);--line:color-mix(in srgb,var(--text) 13%,transparent);--soft:color-mix(in srgb,var(--primary) 10%,var(--surface));
--ok:#16a34a;--warn:#d97706;--err:#dc2626;--info:#0284c7;--radius:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),'Noto Sans Thai',system-ui,sans-serif;font-size:var(--fs);line-height:1.55}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-weight:var(--hw);line-height:1.3;margin:.2em 0 .5em}
h1{font-size:1.7em}h2{font-size:1.35em}h3{font-size:1.15em}h4{font-size:1em;margin:.2em 0}
p{margin:.4em 0}
.muted{color:var(--muted)}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.page{padding:24px 16px 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.55em 1.1em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:.95em;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--secondary);border-color:var(--secondary);color:var(--on-secondary)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:.32em .75em;font-size:.85em}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;width:100%;min-width:0}
input[type=color]{padding:2px;height:42px;cursor:pointer}
input[type=range]{padding:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);border-color:var(--primary)}
label{display:flex;flex-direction:column;gap:4px;font-size:.9em;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;color:var(--text);gap:8px}
label.chk input{width:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.badge{display:inline-block;padding:.1em .65em;border-radius:99px;font-size:.78em;font-weight:600;background:var(--line);color:var(--text);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.err{background:color-mix(in srgb,var(--err) 14%,var(--surface));color:var(--err)}
.badge.info{background:color-mix(in srgb,var(--info) 14%,var(--surface));color:var(--info)}
.badge.pre{background:color-mix(in srgb,var(--secondary) 18%,var(--surface));color:color-mix(in srgb,var(--secondary) 80%,#000)}
.badge.sp{background:var(--soft);color:var(--primary)}
.ok-t{color:var(--ok)}.err-t{color:var(--err)}.pre-t{color:color-mix(in srgb,var(--secondary) 80%,#000)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--err);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar>*{flex:1 1 160px}
.toolbar>.btn{flex:0 0 auto}
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:color-mix(in srgb,var(--text) 25%,transparent);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--primary)}
.sw input:checked+span:before{transform:translateX(18px)}
/* store header */
.sh{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:1.2em}
.brand img{height:36px;width:auto;max-width:120px;object-fit:contain}
.nav{display:flex;gap:4px}
.nav a{padding:.4em .9em;border-radius:99px;color:var(--muted)}
.nav a:hover,.nav a.on{background:var(--soft);color:var(--primary)}
.hsearch{display:flex;gap:6px;flex:1 1 200px;max-width:380px;margin-left:auto}
.hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{padding:.3em .8em;border-radius:99px;background:var(--soft);color:var(--primary);font-weight:600;font-size:.9em}
.mob{display:none}
.bellb{position:relative}
.bellb i{position:absolute;top:-4px;right:-4px;background:var(--err);color:#fff;font-style:normal;font-size:.7em;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
@media(max-width:860px){.mob{display:inline-flex}.nav{display:none;order:10;width:100%;flex-direction:column}.nav.open{display:flex}.hsearch{order:11;max-width:none;width:100%;flex-basis:100%;margin:0}.hact{margin-left:auto}}
.hero{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/6;background:linear-gradient(120deg,var(--primary),var(--secondary));margin-bottom:28px}
@media(max-width:600px){.hero{aspect-ratio:16/9}}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.hero .slide.on{opacity:1}
.hero .slide img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 26px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
.hero .cap h2{margin:0;font-size:1.6em}.hero .cap p{margin:2px 0 0;opacity:.9}
.hero .ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.8);cursor:pointer;font-size:1.3em}
.hero .ar.l{left:10px}.hero .ar.r{right:10px}
.hero .dots{position:absolute;bottom:10px;right:16px;display:flex;gap:6px}
.hero .dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.hero .dots b.on{background:#fff}
.hero.ph{display:grid;place-items:center;color:var(--on-primary);text-align:center}
.sec{margin:30px 0 14px}
.sec .row{margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:600px){.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.09)}
.pimg{position:relative;aspect-ratio:4/3;background:var(--soft)}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .badge{position:absolute;top:8px;left:8px}
.pbody{padding:12px;display:flex;flex-direction:column;gap:3px}
.price{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.price b{color:var(--primary);font-size:1.15em}
.price s{color:var(--muted);font-size:.85em}
.stk{font-size:.82em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ccard{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;background:var(--soft);cursor:pointer;display:block;border:1px solid var(--line)}
.ccard img{width:100%;height:100%;object-fit:cover}
.ccard div{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pdetail{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){.pdetail{grid-template-columns:1fr}}
.pdetail .big{border-radius:var(--radius);overflow:hidden;aspect-ratio:1/1;background:var(--soft);border:1px solid var(--line)}
.pdetail .big img{width:100%;height:100%;object-fit:cover}
.bigprice{font-size:1.9em;color:var(--primary);font-weight:var(--hw)}
.foot{border-top:1px solid var(--line);padding:22px 0;text-align:center;color:var(--muted);background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.authbox{max-width:430px;margin:30px auto}
.bal{font-size:2em;font-weight:var(--hw);color:var(--primary)}
.bank{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.bank input{width:auto;margin-top:4px}
.bank:has(input:checked){border-color:var(--primary);background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:.3em .9em;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--text)}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.qty{display:flex;align-items:center;gap:8px}
.qty input{width:80px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:.45em 1em;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--text)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;padding:4px 0}
.tl div:before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.overlay.top{z-index:200;align-items:center}
.modal{background:var(--surface);color:var(--text);border-radius:var(--radius);padding:20px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}.modal.sm{max-width:400px}
.modal h3{margin-top:0}
#toasts{position:fixed;right:14px;bottom:14px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:#1f2430;color:#fff;padding:.7em 1.1em;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:in .25s}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* image field */
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:10px}
.imgprev{width:120px;height:90px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.8em;text-align:center;flex:none}
.imgprev img{width:100%;height:100%;object-fit:contain}
.imgmeta{font-size:.8em;color:var(--muted);flex:1 1 160px}
/* admin */
.adm{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{margin-bottom:18px}
.side a{display:flex;gap:10px;align-items:center;padding:.6em .9em;border-radius:10px;color:var(--muted);margin-bottom:2px}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--primary);color:var(--on-primary)}
.amain{min-width:0}
.atop{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.atop h2{margin:0;font-size:1.15em}
.abody{padding:20px}
@media(max-width:900px){.adm{display:block}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:.2s}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.abody{padding:14px}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{display:block}
.stat .ic{font-size:1.5em}
.stat b{display:block;font-size:1.5em;font-weight:var(--hw)}
a.stat:hover{border-color:var(--primary)}
.chart{width:100%;height:auto}
.pv{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--bg);color:var(--text);font-family:var(--font),'Noto Sans Thai',system-ui,sans-serif;font-size:var(--fs)}
.pvh{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:8px 12px;border-radius:10px;margin-bottom:10px}
.pvlogo{display:flex;align-items:center;gap:8px}.pvlogo img{height:28px;width:auto}
.pvhero{height:110px;border-radius:10px;background:linear-gradient(120deg,var(--primary),var(--secondary));margin-bottom:10px;overflow:hidden}
.pvhero img{width:100%;height:100%;object-fit:cover}
.pvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pvc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.pvc i{display:block;height:50px;border-radius:8px;background:var(--soft);margin-bottom:6px}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<noscript>กรุณาเปิดใช้งาน JavaScript</noscript>
<script>
'use strict';
/* =====================================================================
   MyShop — ระบบร้านค้าออนไลน์ (ไฟล์เดียว) — ใช้ localStorage เป็นฐานข้อมูลจำลอง
   ยังไม่เชื่อม Supabase / ใช้ข้อมูลตัวอย่าง
   ===================================================================== */

/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>'฿'+(+n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const fdate=iso=>iso?new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fday=iso=>iso?new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';
const dayKey=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const monthKey=iso=>dayKey(iso).slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const kb=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const empty=m=>`<div class="empty">${esc(m)}</div>`;
function cyrb53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const pwHash=p=>cyrb53('salt#'+p+'#myshop',7); // ตัวอย่างเท่านั้น — เมื่อมี Backend ให้เปลี่ยนเป็น bcrypt/argon2 ฝั่งเซิร์ฟเวอร์
const slipHash=s=>cyrb53(s,1)+'-'+cyrb53(s,2)+'-'+s.length;
let seedR=11;const rnd=()=>(seedR=(seedR*16807)%2147483647)/2147483647;

/* ---------- Constants ---------- */
const LS='myshop_demo_db_v1',SES='myshop_demo_session_v1';
const THEME_DEFAULT={storeName:'MyShop',logo:'',primary:'#6d5efc',secondary:'#ff7a59',bg:'#f6f7fb',surface:'#ffffff',text:'#1f2430',font:'Prompt',fontSize:16,headWeight:700};
const FONTS=['Prompt','Kanit','Sarabun','Noto Sans Thai','Mitr','Athiti','ระบบ (System)'];
const BANKS=['กสิกรไทย (KBANK)','ไทยพาณิชย์ (SCB)','กรุงเทพ (BBL)','กรุงไทย (KTB)','กรุงศรีอยุธยา (BAY)','ทหารไทยธนชาต (ttb)','ออมสิน (GSB)','ธ.ก.ส. (BAAC)','พร้อมเพย์ (PromptPay)'];
const LEVELS=['ทั่วไป','Silver','Gold','VIP'];
const ROLES={admin:'ผู้ดูแลระบบ',member:'สมาชิก',agent:'ตัวแทนจำหน่าย'};
const ST={pending:['รอดำเนินการ','warn'],processing:['กำลังเตรียมสินค้า','info'],po_wait:['รอสินค้าเข้า','warn'],po_arrived:['สินค้าเข้าแล้ว','info'],shipped:['จัดส่งแล้ว','info'],done:['สำเร็จ','ok'],cancelled:['ยกเลิก','err']};
const FLOW={stock:['done','cancelled'],preorder:['po_wait','po_arrived','shipped','done','cancelled']};
const TOPST={pending:['รอตรวจสอบ','warn'],approved:['อนุมัติแล้ว','ok'],rejected:['ปฏิเสธ','err']};
const TXT={topup:'เติมเงิน',purchase:'ซื้อสินค้า',refund:'คืนเงิน',adjust:'ปรับยอดโดยแอดมิน'};
const badge=(t,c)=>`<span class="badge ${c||''}">${esc(t)}</span>`;
const stBadge=s=>badge(ST[s][0],ST[s][1]);
const typeBadge=t=>t==='preorder'?badge('พรีออเดอร์','pre'):badge('พร้อมส่ง','ok');
const roleBadge=r=>badge(ROLES[r]||r,r==='admin'?'err':r==='agent'?'pre':'info');

/* ---------- State ---------- */
let db=null,me=null,sliderT=null,purchasing=false;
const imgState={},imgHooks={};
const ui={shop:{q:'',cat:'',type:'',sort:'rec'},a:{prodQ:'',prodType:'',prodCat:'',ordQ:'',ordType:'',ordStatus:'',memQ:'',memRole:'',memStatus:'',finTab:'pending',topQ:'',topStatus:'',txQ:'',txType:'',dayRange:30,metric:'sales'},ordTab:'',nav:false,side:false,draft:null,buy:null};

/* ---------- Placeholder image ---------- */
function ph(name){let h=0;for(const ch of String(name||'x'))h=(h*31+ch.charCodeAt(0))%360;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,74%)"/><stop offset="1" stop-color="hsl(${(h+50)%360},70%,60%)"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><text x="200" y="175" font-size="90" text-anchor="middle">🛍️</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
const imgOf=o=>(o&&o.image)||ph(o&&o.name);

/* ---------- Persistence ---------- */
function migrate(d){(d.orders||[]).forEach(o=>{if(o.type==='stock'&&o.status!=='done'&&o.status!=='cancelled'){o.status='done';(o.history=o.history||[]).push({status:'done',at:new Date().toISOString()})}});(d.products||[]).forEach(p=>{if(!Array.isArray(p.items)){p.items=[];if(p.type==='stock')for(let i=1;i<=(+p.stock||0);i++)p.items.push({id:uid(),text:p.name+' #'+String(i).padStart(3,'0'),sold:false,orderId:''})}});return d}
function load(){try{const raw=localStorage.getItem(LS);if(raw){const d=JSON.parse(raw);if(d&&d.v===1)return migrate(d)}}catch(e){}

function commit(fn){const snap=JSON.stringify(db);try{fn()}catch(e){db=JSON.parse(snap);toast(e.message||'เกิดข้อผิดพลาด','err');return false}
 if(!save()){db=JSON.parse(snap);return false}return true}

function priceFor(p,u){const sp=u&&db.specialPrices.find(s=>s.userId===u.id&&s.productId===p.id);
 if(sp)return{price:sp.price,kind:'special'};
 if(u&&u.role==='agent'&&p.agentPrice!=null&&p.agentPrice!=='')return{price:+p.agentPrice,kind:'agent'};
 return{price:+p.price,kind:'normal'}}

/* ---------- Theme ---------- */
function contrast(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return'#fff';const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)>165?'#111827':'#ffffff'}
function fontStack(f){return f==='ระบบ (System)'?'system-ui,-apple-system,"Segoe UI",sans-serif':`'${f}',system-ui,sans-serif`}
const loadedFonts=new Set();
function loadFont(f){if(!f||f==='ระบบ (System)'||loadedFonts.has(f))return;loadedFonts.add(f);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f).replace(/%20/g,'+')+':wght@400;500;600;700;800&display=swap';document.head.appendChild(l)}
function applyTheme(s,el){el=el||document.documentElement;const st=el.style;
 st.setProperty('--primary',s.primary);st.setProperty('--secondary',s.secondary);st.setProperty('--bg',s.bg);st.setProperty('--surface',s.surface);st.setProperty('--text',s.text);
 st.setProperty('--on-primary',contrast(s.primary));st.setProperty('--on-secondary',contrast(s.secondary));
 st.setProperty('--font',fontStack(s.font));st.setProperty('--fs',(+s.fontSize||16)+'px');st.setProperty('--hw',String(s.headWeight||700));
 loadFont(s.font);if(el===document.documentElement)document.title=s.storeName||'MyShop'}

/* ---------- Image picker + compression ---------- */
function imgField(key,current,o){o=o||{};imgState[key]=current||'';
 return `<div class="imgf"><div class="imgprev" id="prev-${key}">${current?`<img src="${current}" alt="">`:'ยังไม่ได้เลือกรูป'}</div>
 <div class="imgmeta" id="meta-${key}">${esc(o.hint||'เลือกรูปจากเครื่อง ระบบจะแสดงตัวอย่างและบีบอัดให้ก่อนบันทึก')}</div>
 <div class="row"><label class="btn sm" style="flex-direction:row;color:var(--text)"><input type="file" accept="image/*" hidden data-imgpick="${key}" data-max="${o.max||800}" data-q="${o.q||0.75}" data-bytes="${o.bytes||150000}" data-alpha="${o.alpha?1:0}">📁 เลือกรูป</label>
 <button type="button" class="btn sm ghost" data-act="imgClear" data-key="${key}">ลบรูป</button></div></div>`}
function dataBytes(d){return Math.round((d.length-d.indexOf(',')-1)*3/4)}
function compressImage(file,max,q,maxBytes,alpha){return new Promise((res,rej)=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
 img.onload=()=>{URL.revokeObjectURL(url);let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return rej(new Error('img'));
  const sc=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
  const cv=document.createElement('canvas');
  const draw=()=>{cv.width=w;cv.height=h;const c=cv.getContext('2d');if(!alpha){c.fillStyle='#fff';c.fillRect(0,0,w,h)}c.drawImage(img,0,0,w,h)};
  draw();let type='image/webp',qq=q,d=cv.toDataURL(type,qq);
  if(!d.startsWith('data:image/webp')){type=alpha?'image/png':'image/jpeg';d=cv.toDataURL(type,qq)}
  let g=0;while(dataBytes(d)>maxBytes&&g<10){g++;if(type!=='image/png'&&qq>0.45)qq=Math.round((qq-0.1)*100)/100;else{w=Math.max(1,Math.round(w*0.85));h=Math.max(1,Math.round(h*0.85));draw()}d=cv.toDataURL(type,qq)}
  res({dataUrl:d,bytes:dataBytes(d),w,h})};
 img.src=url})}
async function handlePick(el){const key=el.dataset.imgpick,file=el.files&&el.files[0];if(!file)return;
 if(!/^image\//.test(file.type)){toast('กรุณาเลือกไฟล์รูปภาพเท่านั้น','err');el.value='';return}
 if(file.size>25*1024*1024){toast('ไฟล์ใหญ่เกิน 25MB','err');el.value='';return}
 const meta=$('#meta-'+key);if(meta)meta.textContent='กำลังบีบอัดรูป...';
 try{const r=await compressImage(file,+el.dataset.max,+el.dataset.q,+el.dataset.bytes,el.dataset.alpha==='1');
  imgState[key]=r.dataUrl;const pv=$('#prev-'+key);if(pv)pv.innerHTML=`<img src="${r.dataUrl}" alt="">`;
  if(meta)meta.textContent=`ต้นฉบับ ${kb(file.size)} → บีบอัดแล้ว ${kb(r.bytes)} (${r.w}×${r.h}px) • ยังไม่ได้บันทึก กดปุ่มบันทึกเพื่อยืนยัน`;
  if(imgHooks[key])imgHooks[key](r.dataUrl)}
 catch(e){if(meta)meta.textContent='';toast('อ่านไฟล์รูปไม่สำเร็จ (ไฟล์อาจเสียหรือเบราว์เซอร์ไม่รองรับรูปแบบนี้)','err')}
 el.value=''}

function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(data,color){const W=720,H=260,pl=52,pb=28,pt=12,pr=8,max=Math.max(1,...data.map(d=>d.value)),nm=niceMax(max),iw=W-pl-pr,ih=H-pt-pb,bw=iw/data.length,step=Math.ceil(data.length/10);
 const sh=n=>n>=1000?(n/1000).toFixed(n%1000?1:0)+'k':String(Math.round(n));
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="กราฟ">`;
 for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${sh(nm*i/4)}</text>`}
 data.forEach((d,i)=>{const h=ih*d.value/nm,x=pl+i*bw+bw*0.15;s+=`<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2" fill="${color}"><title>${esc(d.label)}: ${money(d.value)}</title></rect>`;if(i%step===0)s+=`<text x="${(x+bw*0.35).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.label)}</text>`});
 return s+'</svg>'}

 if(ok){closeModal();ui.buy=null;toast(`สั่งซื้อสำเร็จ เลขที่ ${order.no}`,'ok');if(order.type==='stock'){render();receiptModal(order)}else nav('orders')}else{buyModal()}}finally{purchasing=false}}

/* ---------- Slip verification (API) ---------- */
async function verifySlip(t){const c=db.api;if(!c.enabled||!c.url)return{state:'manual',msg:'รอผู้ดูแลตรวจสอบสลิป'};
 const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),12000);
 try{const headers={'Content-Type':'application/json'};if(c.key){headers['Authorization']='Bearer '+c.key;headers['x-api-key']=c.key}if(c.secret)headers['x-api-secret']=c.secret;
  const res=await fetch(c.url,{method:'POST',headers,body:JSON.stringify({amount:t.amount>0?t.amount:undefined,image:(t.slip.split(',')[1]||''),ref:t.no}),signal:ctrl.signal});
  const j=await res.json().catch(()=>null);
  if(!res.ok)return{state:'manual',msg:'API ตอบกลับ '+res.status+' — รอผู้ดูแลตรวจสอบ'};
  const ok=j&&(j.success===true||j.valid===true||j.status===200||j.status==='success'||j.status==='valid');
  if(ok){const amt=j.amount!=null?j.amount:(j.data&&j.data.amount);if(!(t.amount>0)){if(amt!=null&&+amt>0)return{state:'ok',amount:+amt,msg:'API ยืนยันสลิปถูกต้อง ยอด '+amt+' บาท'};return{state:'manual',msg:'API ไม่ส่งยอดเงินกลับมา — รอผู้ดูแลระบุยอด'}}if(amt!=null&&Math.abs(+amt-t.amount)>0.009)return{state:'manual',msg:`ยอดในสลิป (${amt}) ไม่ตรงกับที่แจ้ง — รอผู้ดูแลตรวจสอบ`};return{state:'ok',msg:'API ยืนยันสลิปถูกต้อง'}}
  if(j&&(j.success===false||j.valid===false))return{state:'invalid',msg:String(j.message||'API แจ้งว่าสลิปไม่ถูกต้อง').slice(0,150)};
  return{state:'manual',msg:'อ่านผลจาก API ไม่ได้ — รอผู้ดูแลตรวจสอบ'}}
 catch(e){return{state:'manual',msg:'เชื่อมต่อ API ไม่สำเร็จ — รอผู้ดูแลตรวจสอบ'}}finally{clearTimeout(tm)}}
async function testApi(){const f=$('#apiform');if(!f)return;const url=f.url.value.trim();if(!/^https?:\/\//i.test(url))return toast('กรุณากรอก API URL ที่ขึ้นต้นด้วย http:// หรือ https://','err');
 if(!commit(()=>{db.api={enabled:f.enabled.checked,url,key:f.key.value.trim(),secret:f.secret.value.trim(),status:'testing',statusAt:new Date().toISOString(),statusMsg:'กำลังทดสอบ...'}}))return;
 const b=$('#apiBadge');if(b)b.innerHTML=apiStatusBadge();let st='fail',msg='';const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),10000);
 try{const c=db.api,headers={'Content-Type':'application/json'};if(c.key){headers['Authorization']='Bearer '+c.key;headers['x-api-key']=c.key}if(c.secret)headers['x-api-secret']=c.secret;
  const res=await fetch(c.url,{method:'POST',headers,body:JSON.stringify({test:true}),signal:ctrl.signal});
  if(res.ok){st='ok';msg='เชื่อมต่อสำเร็จ (HTTP '+res.status+')'}else{msg='เซิร์ฟเวอร์ตอบกลับ HTTP '+res.status+' — ตรวจสอบ URL/คีย์'}}
 catch(e){msg='เชื่อมต่อไม่ได้ (URL ผิด ออฟไลน์ หรือเซิร์ฟเวอร์บล็อก CORS)'}finally{clearTimeout(tm)}
 commit(()=>{db.api.status=st;db.api.statusAt=new Date().toISOString();db.api.statusMsg=msg});toast(msg,st==='ok'?'ok':'err');render()}

  const nu={id:uid(),name,email,phone:f.phone.value.trim(),pass:pwHash(pw),role:'member',level:'ทั่วไป',status:'active',balance:0,createdAt:new Date().toISOString()};
  if(commit(()=>{db.users.push(nu)})){try{localStorage.setItem(SES,nu.id)}catch(e){}toast('สมัครสมาชิกสำเร็จ','ok');nav('account')}},
 profile(f){if(commit(()=>{const u=userOf(me.id);u.name=f.name.value.trim()||u.name;u.phone=f.phone.value.trim()})){toast('บันทึกข้อมูลแล้ว','ok');render()}},
 password(f){const u=userOf(me.id);if(u.pass!==pwHash(f.cur.value))return toast('รหัสผ่านปัจจุบันไม่ถูกต้อง','err');if(f.pw.value!==f.pw2.value)return toast('รหัสผ่านใหม่ไม่ตรงกัน','err');
  if(commit(()=>{userOf(me.id).pass=pwHash(f.pw.value)})){toast('เปลี่ยนรหัสผ่านแล้ว','ok');f.reset()}},
 async topup(f){const btn=$('button.primary',f);if(btn.disabled)return;const amount=0,bank=db.banks.find(b=>b.id===(f.bankId&&f.bankId.value)&&b.active);const slip=imgState.slip;
  if(!bank)return toast('กรุณาเลือกบัญชีที่โอนเงิน','err');if(!slip)return toast('กรุณาแนบรูปสลิปการโอนเงิน','err');
  const hash=slipHash(slip);if(db.topups.some(t=>t.slipHash===hash&&t.status!=='rejected'))return toast('สลิปนี้ถูกใช้แจ้งเติมเงินไปแล้ว (สลิปซ้ำ)','err');
  btn.disabled=true;btn.textContent='กำลังส่งและตรวจสอบสลิป...';let id=null;
  if(!commit(()=>{const t=newTopup(userOf(me.id),amount,bank,slip,hash,new Date().toISOString());id=t.id;notify('topup',`มีรายการเติมเงินใหม่ ${t.no} จาก ${me.name} รอตรวจสอบและระบุยอด`,'admin')})){btn.disabled=false;btn.textContent='ส่งสลิปเพื่อเติมเงิน';return}
  const v=await verifySlip(db.topups.find(x=>x.id===id));
  commit(()=>{const x=db.topups.find(q=>q.id===id);if(v.amount>0)x.amount=r2(v.amount);x.apiMsg=v.msg;x.method=v.state==='manual'?'manual':'api';
   if(v.state==='ok')approveTopup(id,'API');else if(v.state==='invalid'){x.status='rejected';x.note=v.msg;x.reviewedAt=new Date().toISOString();x.reviewedBy='API';notify('topup',`รายการเติมเงิน ${x.no} ไม่ผ่านการตรวจสอบ: ${v.msg}`,x.userId)}});
  const x=db.topups.find(q=>q.id===id);
  if(x&&x.status==='approved')toast('เติมเงินสำเร็จ ยอดเงินถูกเพิ่มเข้ากระเป๋าแล้ว','ok');else if(x&&x.status==='rejected')toast('สลิปไม่ผ่านการตรวจสอบ: '+x.note,'err');else toast('ส่งสลิปแล้ว รอผู้ดูแลตรวจสอบ','ok');
  render()},
 product(f){const id=f.dataset.id,name=f.name.value.trim(),type=f.type.value,price=parseFloat(f.price.value);if(!name)return toast('กรุณากรอกชื่อสินค้า','err');if(!(price>=0))return toast('ราคาไม่ถูกต้อง','err');
  const ap=f.agentPrice.value.trim()===''?null:parseFloat(f.agentPrice.value);if(ap!==null&&!(ap>=0))return toast('ราคาตัวแทนไม่ถูกต้อง','err');
  const lines=type==='stock'?parseItems(f.stockItems.value):null;
  const data={name,categoryId:f.categoryId.value,type,price,agentPrice:ap,stock:0,etaDate:type==='preorder'?f.etaDate.value:'',etaNote:type==='preorder'?f.etaNote.value.trim():'',description:f.description.value.trim(),image:imgState.prod||'',active:f.active.checked};
  if(commit(()=>{let p;if(id){p=prodOf(id);Object.assign(p,data)}else{data.id=uid();data.items=[];data.createdAt=new Date().toISOString();data.order=db.products.reduce((m,x)=>Math.max(m,x.order||0),-1)+1;db.products.push(data);p=data}
  if(lines){const sold=p.items.filter(i=>i.sold),pool=p.items.filter(i=>!i.sold),next=[];for(const t of lines){const k=pool.findIndex(i=>i.text===t);if(k>=0)next.push(pool.splice(k,1)[0]);else next.push({id:uid(),text:t,sold:false,orderId:''})}p.items=[...sold,...next]}else if(!Array.isArray(p.items))p.items=[];
  syncStock(p)})){closeModal();toast('บันทึกสินค้าแล้ว','ok');render()}},
 category(f){const id=f.dataset.id,name=f.name.value.trim();if(!name)return toast('กรุณากรอกชื่อหมวดหมู่','err');
  if(commit(()=>{if(id){const c=catOf(id);c.name=name;c.image=imgState.cat||'';c.active=f.active.checked}else db.categories.push({id:uid(),name,image:imgState.cat||'',active:f.active.checked,order:db.categories.reduce((m,c)=>Math.max(m,c.order||0),-1)+1})})){closeModal();toast('บันทึกหมวดหมู่แล้ว','ok');render()}},
 banner(f){const id=f.dataset.id;if(!imgState.ban&&!f.title.value.trim())return toast('กรุณาเลือกรูปหรือกรอกหัวข้อแบนเนอร์','err');
  const data={title:f.title.value.trim(),subtitle:f.subtitle.value.trim(),image:imgState.ban||'',active:f.active.checked};
  if(commit(()=>{if(id)Object.assign(db.banners.find(b=>b.id===id),data);else db.banners.push({id:uid(),...data,order:db.banners.reduce((m,b)=>Math.max(m,b.order||0),-1)+1})})){closeModal();toast('บันทึกแบนเนอร์แล้ว แสดงผลบนหน้าร้านทันที','ok');render()}},
 member(f){const id=f.dataset.id,email=f.email.value.trim().toLowerCase(),pw=f.password.value;
  if(db.users.some(u=>u.id!==id&&u.email.toLowerCase()===email))return toast('อีเมลนี้ถูกใช้แล้ว','err');if(pw&&pw.length<6)return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','err');
  const data={name:f.name.value.trim(),email,phone:f.phone.value.trim(),role:f.role.value,level:f.level.value,status:f.status.value};
  if(commit(()=>{if(id){const u=userOf(id);const admins=db.users.filter(x=>x.role==='admin'&&x.status==='active'&&x.id!==id);
    if(u.role==='admin'&&(data.role!=='admin'||data.status!=='active')&&!admins.length)throw new Error('ต้องมีผู้ดูแลระบบที่ใช้งานได้อย่างน้อย 1 บัญชี');
    if(id===me.id&&(data.role!=='admin'||data.status!=='active'))throw new Error('ไม่สามารถลดสิทธิ์หรือระงับบัญชีของตัวเองได้');
    Object.assign(u,data);if(pw)u.pass=pwHash(pw);if(f.balance){const nb=r2(parseFloat(f.balance.value));if(!Number.isFinite(nb)||nb<0)throw new Error('ยอดเงินไม่ถูกต้อง');const diff=r2(nb-u.balance);if(diff!==0)addTx(u,'adjust',diff,'','ปรับยอดโดยแอดมิน')}}else{if(!pw)throw new Error('กรุณากรอกรหัสผ่าน');db.users.push({id:uid(),...data,pass:pwHash(pw),balance:0,createdAt:new Date().toISOString()})}})){closeModal();toast('บันทึกข้อมูลสมาชิกแล้ว','ok');render()}},
 special(f){const uid2=f.dataset.id,pid=f.productId.value,price=parseFloat(f.price.value);if(!pid||!(price>=0))return toast('กรุณาเลือกสินค้าและกรอกราคาให้ถูกต้อง','err');
  if(commit(()=>{const ex=db.specialPrices.find(s=>s.userId===uid2&&s.productId===pid);if(ex)ex.price=price;else db.specialPrices.push({id:uid(),userId:uid2,productId:pid,price})}))toast('บันทึกราคาพิเศษแล้ว','ok');openMemberView(uid2)},
 bank(f){const id=f.dataset.id;const data={bankName:f.bankName.value,accName:f.accName.value.trim(),accNo:f.accNo.value.trim(),active:f.active.checked,showOnStore:f.showOnStore.checked,qr:imgState.qr||''};if(!data.accName||!data.accNo)return toast('กรุณากรอกข้อมูลบัญชีให้ครบ','err');
  if(commit(()=>{let b;if(id){b=db.banks.find(x=>x.id===id);Object.assign(b,data)}else{b={id:uid(),...data,primary:false};db.banks.push(b)}if(f.primary.checked)db.banks.forEach(x=>x.primary=x.id===b.id);fixPrimary()})){closeModal();toast('บันทึกบัญชีรับเงินแล้ว','ok');render()}},
 api(f){const url=f.url.value.trim();if(url&&!/^https?:\/\//i.test(url))return toast('API URL ต้องขึ้นต้นด้วย http:// หรือ https://','err');
  if(commit(()=>{db.api={...db.api,enabled:f.enabled.checked,url,key:f.key.value.trim(),secret:f.secret.value.trim(),status:'none',statusAt:null,statusMsg:'บันทึกแล้ว ยังไม่ได้ทดสอบการเชื่อมต่อ'}})){toast('บันทึกการตั้งค่า API แล้ว','ok');render()}}
};
const ADMIN_FORMS=new Set(['stockAdd','stockEdit','product','category','banner','member','special','bank','api']);
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];if(!h)return;
 if(ADMIN_FORMS.has(f.dataset.form)&&!isAdmin())return toast('ไม่มีสิทธิ์ใช้งานส่วนนี้','err');
 try{await h(f)}catch(err){console.error(err);toast('เกิดข้อผิดพลาด: '+(err.message||err),'err')}});

/* ---------- Init ---------- */
db=load();
render();
</script>
